<a class="skip-link" href="#content">
  {{ language() === 'de' ? 'Zum Inhalt springen' : 'Skip to content' }}
</a>

<header class="site-header" [class.is-open]="menuOpen()">
  <div class="container header-inner">
    <a class="brand" [href]="copy().homePath" [attr.aria-label]="copy().brandLabel" (click)="closeMenu()">
      <img class="brand-mark" src="/hugo-martin-mark.svg" alt="" width="36" height="36" />
      <span class="brand-copy">
        <strong>Hugo Martin</strong>
        <span>{{ copy().subtitle }}</span>
      </span>
    </a>

    <button
      #navToggle
      type="button"
      class="nav-toggle"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="primary-nav"
      [attr.aria-label]="copy().menuLabel"
      (click)="toggleMenu()"
    >
      <span class="nav-toggle-bar"></span>
      <span class="nav-toggle-bar"></span>
    </button>

    <div class="header-actions" id="primary-nav">
      <nav class="nav-links" [attr.aria-label]="copy().navigationLabel">
        @for (item of navigation(); track item.pageKey) {
          <a
            [href]="item.path"
            [class.is-active]="pageKey() === item.pageKey"
            [attr.aria-current]="pageKey() === item.pageKey ? 'page' : null"
            (click)="closeMenu()"
          >{{ item.label }}</a>
        }
      </nav>

      <div class="header-controls">
        <a
          class="language-link"
          [href]="languagePath()"
          [attr.aria-label]="copy().languageLabel"
          [attr.hreflang]="language() === 'de' ? 'en' : 'de-DE'"
          [attr.lang]="language() === 'de' ? 'en' : 'de'"
          (click)="closeMenu()"
        >{{ copy().languageText }}</a>
        <button type="button" class="nav-cta" data-cta="service-contact-header" (click)="openContactForm()">
          {{ copy().cta }}
        </button>
      </div>
    </div>
  </div>
</header>
