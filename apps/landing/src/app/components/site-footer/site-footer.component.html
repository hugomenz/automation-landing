<footer class="site-footer">
  <div class="container footer-grid">
    <div class="footer-intro">
      <a class="footer-brand" [href]="language() === 'de' ? '/' : '/en/'">
        <img class="footer-brand-mark" src="/hugo-martin-mark.svg" alt="" width="36" height="36" />
        <strong>Hugo Martin</strong>
      </a>
      <p>{{ copy().description }}</p>
      <a [href]="linkedin" rel="noreferrer" target="_blank">LinkedIn</a>
    </div>

    @for (group of copy().groups; track group.label; let last = $last) {
      <nav class="footer-group" [attr.aria-label]="group.label">
        <strong>{{ group.label }}</strong>
        @for (link of group.links; track link.href) {
          <a [href]="link.href">{{ link.label }}</a>
        }
        @if (last) {
          <a
            [href]="languagePath()"
            [attr.hreflang]="language() === 'de' ? 'en' : 'de-DE'"
            [attr.lang]="language() === 'de' ? 'en' : 'de'"
          >{{ copy().languageLabel }}</a>
        }
      </nav>
    }
  </div>

  <div class="container footer-bottom">
    <span>© Hugo Martin</span>
    <span class="footer-location mono"><i aria-hidden="true"></i>Stuttgart · Remote</span>
  </div>
</footer>
